name: Build VisionClaw IPA with OpenRouter

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Xcode project
        run: |
          set -e
          PROJECT_FILE=$(find . -name "CameraAccess.xcodeproj" | head -1)
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -1)
          fi
          echo "PROJECT_FILE=$PROJECT_FILE" >> $GITHUB_ENV
          echo "Found project: $PROJECT_FILE"

      - name: Create Secrets.swift and patch for OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ No OPENROUTER_API_KEY secret set."
            exit 1
          fi

          # Create Secrets.swift with the key
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          SRC_DIR="$PROJECT_DIR/CameraAccess"
          echo "Source dir: $SRC_DIR"
          mkdir -p "$SRC_DIR"
          printf 'import Foundation\n\nlet apiKey = "%s"\n' "$OPENROUTER_API_KEY" > "$SRC_DIR/Secrets.swift"
          echo "✅ Created Secrets.swift"

          # Patch all Swift files
          # 1. Change API URL
          find . -name "*.swift" -exec sed -i '' 's#https://api.anthropic.com/v1/messages#https://openrouter.ai/api/v1/messages#g' {} +
          find . -name "*.swift" -exec sed -i '' 's#https://api.anthropic.com#https://openrouter.ai/api/v1#g' {} +
          # 2. Change auth header from x-api-key to Authorization: Bearer
          find . -name "*.swift" -exec sed -i '' 's/"x-api-key"/"Authorization"/g' {} +
          find . -name "*.swift" -exec sed -i '' 's/forHTTPHeaderField: "x-api-key"/forHTTPHeaderField: "Authorization"/g' {} +
          # 3. Change model names
          find . -name "*.swift" -exec sed -i '' 's/"claude-[^"]*"/"anthropic\/claude-3.5-sonnet"/g' {} +
          find . -name "*.swift" -exec sed -i '' "s/'claude-[^']*'/'anthropic\/claude-3.5-sonnet'/g" {} +
          # 4. Prepend "Bearer " to the key value (if the code uses a variable)
          find . -name "*.swift" -exec sed -i '' 's/"Bearer \\(apiKey)\"/"Bearer \\(apiKey)"/g' {} +  # just in case

          echo "✅ Patched API endpoint, auth header, and models"

      - name: Build .app (unsigned)
        run: |
          set -e
          case "$PROJECT_FILE" in
            *.xcworkspace) PROJECT_FLAG="-workspace" ;;
            *.xcodeproj) PROJECT_FLAG="-project" ;;
          esac
          echo "Project: $PROJECT_FILE"
          xcodebuild $PROJECT_FLAG "$PROJECT_FILE" \
            -scheme CameraAccess \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create unsigned .ipa
        run: |
          APP_PATH=$(find ./build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found — build failed"
            exit 1
          fi
          mkdir -p ./ipa/Payload
          cp -R "$APP_PATH" ./ipa/Payload/
          cd ./ipa
          zip -qr ../VisionClaw-OpenRouter-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-OpenRouter-unsigned-ipa
          path: VisionClaw-OpenRouter-unsigned.ipa
