name: Build VisionClaw IPA with OpenRouter

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Xcode project
        run: |
          set -e
          # Prefer the exact project if present
          if [ -f "CameraAccess/CameraAccess.xcodeproj/project.pbxproj" ]; then
            PROJECT_FILE="CameraAccess/CameraAccess.xcodeproj"
          else
            PROJECT_FILE=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -1)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ No Xcode project or workspace found."
            exit 1
          fi
          echo "PROJECT_FILE=$PROJECT_FILE" >> $GITHUB_ENV
          echo "Found project: $PROJECT_FILE"

          # Also extract the scheme name (assume it's the same as the project name)
          SCHEME_NAME=$(basename "$PROJECT_FILE" | sed 's/\.xcodeproj//;s/\.xcworkspace//')
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV
          echo "Using scheme: $SCHEME_NAME"

      - name: Create Secrets.swift and patch for OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ No OPENROUTER_API_KEY secret set."
            exit 1
          fi

          # Find the source directory (likely where the app's Swift files are)
          # Use the project directory as base
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          SRC_DIR="$PROJECT_DIR/CameraAccess"   # adjust if your folder is different
          echo "Source dir: $SRC_DIR"
          mkdir -p "$SRC_DIR"

          # Write Secrets.swift with a helper function for the auth header
          cat > "$SRC_DIR/Secrets.swift" <<EOF
          import Foundation

          let apiKey = "$OPENROUTER_API_KEY"
          let apiBaseURL = URL(string: "https://openrouter.ai/api/v1")!
          let defaultModel = "anthropic/claude-3.5-sonnet"

          func authHeader() -> String {
              return "Bearer \(apiKey)"
          }
          EOF
          echo "✅ Created Secrets.swift"

          # --- Patch all Swift files for OpenRouter ---
          # 1. Replace Anthropic API URL with OpenRouter
          find . -name "*.swift" -exec sed -i '' 's|https://api\.anthropic\.com/v1/messages|https://openrouter.ai/api/v1/messages|g' {} +
          find . -name "*.swift" -exec sed -i '' 's|https://api\.anthropic\.com|https://openrouter.ai/api/v1|g' {} +

          # 2. Replace x-api-key header with Authorization and add Bearer prefix
          # Common patterns:
          #   setValue(apiKey, forHTTPHeaderField: "x-api-key")
          #   setValue(apiKey, forHTTPHeaderField: "Authorization")  (if already changed)
          find . -name "*.swift" -exec sed -i '' 's/setValue(apiKey, forHTTPHeaderField: "x-api-key")/setValue(authHeader(), forHTTPHeaderField: "Authorization")/g' {} +
          # If the key is used as a literal in headers, replace the header name
          find . -name "*.swift" -exec sed -i '' 's/"x-api-key"/"Authorization"/g' {} +
          # If the code already uses "Bearer \(apiKey)" it's fine; otherwise we use our authHeader()
          find . -name "*.swift" -exec sed -i '' 's/"Bearer \\(apiKey)"/authHeader()/g' {} +

          # 3. Replace model names (e.g., "claude-3-opus-20240229") with OpenRouter model
          find . -name "*.swift" -exec sed -i '' 's/"claude-[^"]*"/"anthropic\/claude-3.5-sonnet"/g' {} +

          # 4. If the code hardcodes "Bearer " in front of the key, ensure it uses authHeader() too
          find . -name "*.swift" -exec sed -i '' 's/"Bearer " + apiKey/authHeader()/g' {} +

          echo "✅ Patched API endpoint, auth header, and models"

          # Show what was changed (for debugging)
          echo "--- Changed lines ---"
          grep -rn "openrouter\|authHeader\|Authorization" --include="*.swift" . || true

      - name: Build .app (unsigned, Sideloadly‑ready)
        run: |
          set -e
          case "$PROJECT_FILE" in
            *.xcworkspace) PROJECT_FLAG="-workspace" ;;
            *.xcodeproj) PROJECT_FLAG="-project" ;;
          esac
          echo "Building project: $PROJECT_FILE with scheme: $SCHEME_NAME"

          xcodebuild $PROJECT_FLAG "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=com.yourname.visionclaw \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build

      - name: Prepare .app and create unsigned .ipa
        run: |
          set -e
          APP_PATH=$(find ./build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found — build failed"
            exit 1
          fi
          echo "App path: $APP_PATH"

          # Remove any archived entitlements that might cause Sideloadly issues
          if [ -f "$APP_PATH/archived-expanded-entitlements.xcent" ]; then
            rm -f "$APP_PATH/archived-expanded-entitlements.xcent"
            echo "Removed archived-expanded-entitlements.xcent"
          fi

          # Ensure Info.plist has a valid bundle identifier and deployment target
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.yourname.visionclaw" "$APP_PATH/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.binreaper.visionclaw" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$APP_PATH/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" "$APP_PATH/Info.plist"

          # Package the IPA
          mkdir -p ./ipa/Payload
          cp -R "$APP_PATH" ./ipa/Payload/
          cd ./ipa
          zip -qr ../VisionClaw-OpenRouter-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-OpenRouter-unsigned-ipa
          path: VisionClaw-OpenRouter-unsigned.ipa
