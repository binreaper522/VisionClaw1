name: Build VisionClaw IPA with OpenRouter

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Xcode projects ==="
          find . \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Find Xcode project
        run: |
          set -e
          # Look for the CameraAccess project (the iOS sample)
          PROJECT_FILE=$(find . -name "CameraAccess.xcodeproj" | head -1)
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -1)
          fi
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ No Xcode project found."
            exit 1
          fi
          echo "PROJECT_FILE=$PROJECT_FILE" >> $GITHUB_ENV
          echo "✅ Found project: $PROJECT_FILE"

      - name: Patch for OpenRouter + inject key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ No OPENROUTER_API_KEY secret set."
            exit 1
          fi
          PLACEHOLDER_FILES=$(grep -rl "YOUR_API_KEY\|sk-ant-\|sk-or-v1" --include="*.swift" --include="*.plist" --include="*.xcconfig" . || true)
          if [ -z "$PLACEHOLDER_FILES" ]; then
            echo "⚠️ Could not auto-find API key file. Creating APIKey.swift"
            # Find where CameraAccess source files live
            TARGET_DIR=$(dirname "$PROJECT_FILE")
            printf 'import Foundation\nlet apiKey = "YOUR_API_KEY"\n' > "$TARGET_DIR/APIKey.swift"
            PLACEHOLDER_FILES="$TARGET_DIR/APIKey.swift"
          fi
          for f in $PLACEHOLDER_FILES; do
            echo "Injecting key into: $f"
            sed -i '' -e "s/sk-ant-[a-zA-Z0-9_-]*/$OPENROUTER_API_KEY/g" "$f"
            sed -i '' -e "s/sk-or-v1-[a-zA-Z0-9_-]*/$OPENROUTER_API_KEY/g" "$f"
            sed -i '' -e "s/YOUR_API_KEY/$OPENROUTER_API_KEY/g" "$f"
          done
          find . -name "*.swift" -exec sed -i '' 's#https://api.anthropic.com/v1/messages#https://openrouter.ai/api/v1/messages#g' {} +
          find . -name "*.swift" -exec sed -i '' 's#https://api.anthropic.com#https://openrouter.ai/api/v1#g' {} +
          find . -name "*.swift" -exec sed -i '' 's/"claude-[^"]*"/"anthropic\/claude-3.5-sonnet"/g' {} +
          find . -name "*.swift" -exec sed -i '' "s/'claude-[^']*'/'anthropic\/claude-3.5-sonnet'/g" {} +
          echo "✅ Patching complete"

      - name: Build .app (unsigned)
        run: |
          set -e
          case "$PROJECT_FILE" in
            *.xcworkspace) PROJECT_FLAG="-workspace" ;;
            *.xcodeproj) PROJECT_FLAG="-project" ;;
          esac
          echo "Project file: $PROJECT_FILE"
          echo "=== Schemes ==="
          xcodebuild -list $PROJECT_FLAG "$PROJECT_FILE" 2>/dev/null || true
          SCHEME=$(xcodebuild -list $PROJECT_FLAG "$PROJECT_FILE" 2>/dev/null | awk '/Schemes:/{found=1;next} found && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="CameraAccess"; fi
          echo "Using scheme: $SCHEME"
          xcodebuild $PROJECT_FLAG "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create unsigned .ipa
        run: |
          APP_PATH=$(find ./build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found — build failed"
            exit 1
          fi
          echo "App found: $APP_PATH"
          mkdir -p ./ipa/Payload
          cp -R "$APP_PATH" ./ipa/Payload/
          cd ./ipa
          zip -qr ../VisionClaw-OpenRouter-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        
