name: Build VisionClaw IPA with OpenRouter

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repo structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== All .xcodeproj / .xcworkspace (recursive) ==="
          find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -20

      - name: Patch VisionClaw for OpenRouter + inject key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -e
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ No OPENROUTER_API_KEY secret set."
            exit 1
          fi
          PLACEHOLDER_FILES=$(grep -rl "YOUR_API_KEY\|sk-ant-\|sk-or-v1" --include="*.swift" --include="*.plist" --include="*.xcconfig" . || true)
          if [ -z "$PLACEHOLDER_FILES" ]; then
            echo "⚠️ Could not auto-find API key file. Creating APIKey.swift"
            mkdir -p VisionClaw
            printf 'import Foundation\nlet apiKey = "YOUR_API_KEY"\n' > VisionClaw/APIKey.swift
            PLACEHOLDER_FILES="VisionClaw/APIKey.swift"
          fi
          for f in $PLACEHOLDER_FILES; do
            echo "Injecting key into: $f"
            sed -i '' -e "s/sk-ant-[a-zA-Z0-9_-]*/$OPENROUTER_API_KEY/g" "$f"
            sed -i '' -e "s/sk-or-v1-[a-zA-Z0-9_-]*/$OPENROUTER_API_KEY/g" "$f"
            sed -i '' -e "s/YOUR_API_KEY/$OPENROUTER_API_KEY/g" "$f"
          done
          find . -name "*.swift" -exec sed -i '' 's#https://api.anthropic.com/v1/messages#https://openrouter.ai/api/v1/messages#g' {} +
          find . -name "*.swift" -exec sed -i '' 's#https://api.anthropic.com#https://openrouter.ai/api/v1#g' {} +
          find . -name "*.swift" -exec sed -i '' 's/"claude-[^"]*"/"anthropic\/claude-3.5-sonnet"/g' {} +
          find . -name "*.swift" -exec sed -i '' "s/'claude-[^']*'/'anthropic\/claude-3.5-sonnet'/g" {} +
          echo "✅ Patching complete"

      - name: Find correct Xcode project
        run: |
          set -e
          # 1. Prefer a project named VisionClaw.xcodeproj at root
          PROJECT_FILE=$(find . -maxdepth 1 -name "VisionClaw.xcodeproj" | head -1)
          if [ -z "$PROJECT_FILE" ]; then
            # 2. Fallback: any xcodeproj/workspace at root (not in samples)
            PROJECT_FILE=$(find . -maxdepth 1 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) | head -1)
          fi
          if [ -z "$PROJECT_FILE" ]; then
            # 3. Last fallback: any project that is not in samples folder
            PROJECT_FILE=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | grep -v "/samples/" | head -1)
          fi
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ Could not find a proper Xcode project."
            exit 1
          fi
          echo "PROJECT_FILE=$PROJECT_FILE" >> $GITHUB_ENV
          echo "Using project: $PROJECT_FILE"

          # Determine flag
          case "$PROJECT_FILE" in
            *.xcworkspace) echo "PROJECT_FLAG=-workspace" >> $GITHUB_ENV ;;
            *.xcodeproj) echo "PROJECT_FLAG=-project" >> $GITHUB_ENV ;;
          esac

      - name: List schemes
        run: |
          echo "=== Available schemes for $PROJECT_FILE ==="
          xcodebuild -list $PROJECT_FLAG "$PROJECT_FILE" 2>/dev/null || true

      - name: Build .app (unsigned)
        run: |
          set -e
          # Use the first scheme, or VisionClaw if present
          SCHEME=$(xcodebuild -list $PROJECT_FLAG "$PROJECT_FILE" 2>/dev/null | awk '/Schemes:/{found=1;next} found && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="VisionClaw"; fi
          echo "Using scheme: $SCHEME"

          xcodebuild $PROJECT_FLAG "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create unsigned .ipa
        run: |
          APP_PATH=$(find ./build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found — build failed"
            exit 1
          fi
          echo "App found: $APP_PATH"
          mkdir -p ./ipa/Payload
          cp -R "$APP_PATH" ./ipa/Payload/
          cd ./ipa
          zip -qr ../VisionClaw-OpenRouter-unsigned.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-OpenRouter-unsigned-ipa
          path: VisionClaw-OpenRouter-unsigned.ipa
